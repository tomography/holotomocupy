# STEP 0 -- synthetic mosaic holotomography dataset, YY037A-like geometry.
#
#   ./run_gen.sh                  # NP=1
#   NP=8 ./run_gen.sh
#
# Writes {path_out}/{pfile}_{tile}.h5, one per tile, plus the shared
# {pfile}_prb.h5.  steps15.py consumes those and writes {pfile}_obj.h5.
#
# Geometry taken from /home/beams/VNIKITIN/holotomocupy_mpi_deform/experimental/
# YY037A_mosaic (ESRF ID16A, 2026-04-16 run).  That scan is 5 tiles in one row;
# here the same 5 columns are repeated over ntile_v rows.
#
# There is NO shrinkage / deformation in this dataset: /exchange/shrink is not
# written, so Rec keeps shrink_nd = 0 and eff_demag = 1 / norm_magnification.
#
# The three configs share the section layout below.  Keys that MUST agree
# across config_gen.conf / config_steps15.conf / config_step6.conf:
#   path_out, pfile, bin, shift_dir, the tile grid,
#   nobj and nzobj (here FINEST-grid, there >> bin),
#   ntheta = ntheta_rec, delta_beta = paganin.

# --- paths -------------------------------------------------------------------
path_out=/data3/vnikitin/holobrain_syn  # everything is written here
pfile=holobrain_syn                     # file stem, see the header

# --- acquisition geometry ----------------------------------------------------
energy=33.35                            # keV
focustodetectordistance=1.282           # m
z1=0.0434278,0.0452908,0.0527430,0.0682163
                                        # m, the 4 sample-focus distances
detector_pixelsize=2.95203e-6           # m, UNBINNED
ndet=2048                               # detector is ndet x ndet, unbinned;
                                        # voxelsize = 100.000 nm at bin 0

# --- scan --------------------------------------------------------------------
ntheta=1500                              # angles written to the file
theta_range=180                         # degrees, [0, theta_range)

# --- mosaic layout -----------------------------------------------------------
ntile_h=5                               # tiles per row  (the 5 real columns)
ntile_v=1                               # rows
tile_step_h=2000                        # nominal tile spacing, object px on the
tile_step_v=2000                        # finest grid (FOV of the nearest distance
                                        # is 2048 px, so ~48 px overlap)
shift_rand_px=30                        # per-angle encoder jitter, uniform +-,
                                        # DETECTOR px at bin 0; make_geometry.py
                                        # divides it by norm_magnification
shift_dir=shifts                        # written by make_geometry.py, read here
                                        # and by steps15.py: tile_offsets.txt +
                                        # one <tile>.txt per tile

# --- grids -------------------------------------------------------------------
bin=2                                   # data and object are generated at
                                        # ndet>>bin;  bin 2 = 512 px frames,
                                        # bin 3 = 256 px frames.  See README
                                        # for the memory each level costs.
nobj=12288                              # mosaic width,  FINEST-grid object px
nzobj=3584                              # mosaic height, FINEST-grid object px
                                        # both are divided by 2**bin

# --- probe -------------------------------------------------------------------
# ID16A probe, copied from holotomocupy_mpi_deform/tests/holotomo3d/data/.
# Paths are relative to this file.  Each distance is normalized to mean|prb| = 1.
prb_abs=data/prb_abs_2048.tiff
prb_phase=data/prb_phase_2048.tiff

# --- sample ------------------------------------------------------------------
obj_vol=/data3/vnikitin/mosaic_brain/init.h5
                                        # empty -> zero object (transmission 1).
                                        # .h5 (add ::dataset to pick one, else the
                                        # largest 3-D dataset), .npy, or raw float32.
obj_span_px=10000                       # scale the volume so its x-y extent spans
                                        # this many FINEST object px, centred on the
                                        # mosaic grid: 10000 x 100 nm = 1.000 mm, the
                                        # sample diameter.  z uses the same factor, so
                                        # the aspect ratio is kept and the part of the
                                        # sample outside the scanned band is cropped.
                                        # 0 -> no scaling, obj_vol must already be
                                        # exactly (nzobj, nobj, nobj) binned px.
obj_scale=15                            # multiplies the loaded volume.  The file's grey
                                        # levels are arbitrary, so this is what sets the
                                        # projected phase excursion -- tune it against the
                                        # "projected phase" line gen_data.py prints (a few
                                        # rad to a few tens of rad is well conditioned).
delta_beta=100                          # single-material delta/beta ratio; keep it
                                        # equal to paganin= in the other two configs
                                        # so steps15's Paganin filter matches the
                                        # sample exactly

# --- runtime -----------------------------------------------------------------
nchunk=4                               # angles per GPU batch
log_level=INFO
