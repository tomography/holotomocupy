# STEP 6 -- joint BH reconstruction of the synthetic mosaic from gen_data.py.
#
#   ./run_step6.sh               # NP ranks, one per GPU
#   NP=8 ./run_step6.sh
#
# The input is what config_gen.conf produced and what config_steps15.conf turned
# into an initial object, so path_out/pfile/bin/paganin MUST match both files.
# Checkpoints and the reconstructed object are written back into the same
# directory, as in experimental/Y350a_dist1234.
#
# The three configs share the section layout below.  Keys that MUST agree
# across config_gen.conf / config_steps15.conf / config_step6.conf:
#   path_out, pfile, bin, the tile grid,
#   nobj and nzobj (config_gen's FINEST-grid values >> bin),
#   ntheta = ntheta_rec, paganin = delta_beta.

# --- paths -------------------------------------------------------------------
path_out=/data3/vnikitin/holobrain_syn   # = config_gen.conf path_out; also where checkpoints go
pfile=holobrain_syn                      # -> path_out/{pfile}_<tile>.h5, one file per tile,
                                         #    and the shared {pfile}_obj.h5
# prb_file=holobrain_syn_prb.h5          # ground-truth probe from gen_data.py, relative to
                                         # path_out; comment out to start from a flat probe (=1)
init_vol=                                # optional raw float32 .vol initial object; empty -> read
                                         # obj_init_re{paganin}_{bin} + 1j*obj_init_im{paganin}_{bin}
                                         # from {pfile}_obj.h5, which steps15.py writes
                                         # (mosaic stitch -> Paganin -> FBP)

# --- scan --------------------------------------------------------------------
ntheta=1500            # angles used, thinned evenly from the ntheta= that
                      # config_gen.conf wrote (ids = arange(start_theta, N, N/ntheta)),
                      # so the full 180 deg is still covered.  Raise toward that N as
                      # the host RAM allows.  steps15.py uses the same rule, so
                      # ntheta_rec= there must EQUAL this number, see that file.
start_theta=0
rotation_center_shift=0   # the synthetic scan puts the axis exactly at the centre

# --- mosaic layout -----------------------------------------------------------
# The tile files, in the order they are flattened onto the distance axis. Must
# match the names in shifts/tile_offsets.txt that make_geometry.py wrote and
# gen_data.py used, i.e. "{row}_{col}" row-major, row 0 on top and column 0 on
# the left.
tiles=0_0,0_1,0_2,0_3,0_4  #,1_0,1_1,1_2,1_3,1_4
ndist=4               # distances PER TILE; step6.py expands to ndist x len(tiles)
                      # in tile-major order (flat index = tile*ndist + k), as in
                      # config_gen.conf.  5 tiles x 4 distances = 20; uncomment the
                      # second row above (and set ntile_v=2 in config_gen.conf) for
                      # 10 tiles = 40.

# --- grids -------------------------------------------------------------------
bin=2                 # must match config_gen.conf and config_steps15.conf bin --
                      # gen_data.py writes /exchange/pdata{k}_{bin} at ITS bin only,
                      # so reading at a different one is a missing-dataset error
nz=512                # frame height (= config_gen.conf ndet >> bin)
n=512                # frame height (= config_gen.conf ndet >> bin)
                 # frame width  (= config_gen.conf ndet >> bin)
nzobj=896             # mosaic height (= config_gen.conf nzobj >> bin)
nobj=3072             # mosaic width  (= config_gen.conf nobj  >> bin)

# --- reconstruction ----------------------------------------------------------
niter=1025
start_iter=0          # resume from this iteration (0 = start fresh / latest checkpoint)
paganin=100           # must match the tag in obj_init_re{paganin}_{bin}, i.e.
                      # config_steps15.conf paganin (and config_gen.conf delta_beta)
mask=1.2              # circular mask radius^2 in units of (nobj/2); 1.0 = inscribed
                      # circle.  The 1 mm sample is only 0.66 of that, so nothing
                      # real is clipped.  -1 disables the mask.
lam_prbfit=3.1e-3     # probe fit regularisation weight
lam_laplacian=0       # 3-D Laplacian regularisation weight
rho=1,0.05,0.02,0     # gradient step scales: object, probe, positions, tp (linear shrink A,B)
                      # No 4th entry: there is no shrinkage in this dataset.

# --- runtime -----------------------------------------------------------------
nchunk=4             # projections per GPU batch; raise if GPU memory allows
#ndistchunk=0         # distances processed inside one theta-chunk pass.  0 (default)
                      # takes all ndist, so the vars['proj'] chunk is uploaded once
                      # for every distance instead of once each.  1 restores the old
                      # outer-distance loop exactly.  Lower it only if the GPU is tight.
checkpoint_step=32    # write a checkpoint every N iters; -1 = off
error_step=32         # log the error every N iters; -1 = off
debug_step=-1         # cache hit/miss counters every N iters; -1 = off
log_level=INFO
