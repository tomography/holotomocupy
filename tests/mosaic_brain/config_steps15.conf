# STEPS 1-5 for the synthetic mosaic: stitch -> multi-distance Paganin -> FBP.
#
#   ./run_steps15.sh              # NP=1
#   NP=8 ./run_steps15.sh
#
# Input is what gen_data.py wrote, so path/pfile/bin/tiles/shift_dir MUST match
# config_gen.conf.  Output is {path_out}/{pfile}_obj.h5, the initial object
# step6.py reads, so path_out/pfile/bin/paganin must match config_step6.conf.
#
# The three configs share the section layout below.  Keys that MUST agree
# across config_gen.conf / config_steps15.conf / config_step6.conf:
#   path_out, pfile, bin, shift_dir, the tile grid,
#   nobj and nzobj (config_gen's FINEST-grid values >> bin),
#   ntheta_rec = ntheta, paganin = delta_beta.

# --- paths -------------------------------------------------------------------
path=/data3/vnikitin/holobrain_syn      # = config_gen.conf path_out; the tile .h5 live here
path_out=/data3/vnikitin/holobrain_syn  # {pfile}_obj.h5, _srdata.h5, _proj.h5 go here
pfile=holobrain_syn

# --- scan --------------------------------------------------------------------
ntheta_rec=1500          # angles used, thinned evenly from the ntheta= config_gen.conf
                        # wrote, with the same rule Reader uses.  KEEP THIS EQUAL TO
                        # ntheta= in config_step6.conf: both Tomo.fbp and Rec carry a
                        # sqrt(nobj/ntheta) normalisation, so a different count here
                        # scales the initial object by sqrt(ntheta_step6/ntheta_rec).
                        # This is also the knob for host RAM.
rotation_center_shift=0 # the synthetic scan puts the axis exactly at the centre

# --- mosaic layout -----------------------------------------------------------
# Tile order only fixes the order things are looped over; each tile is placed by
# its own entry in shifts/tile_offsets.txt, and the "{row}_{col}" name tells the
# seam feather which sides face a neighbour.
tiles=0_0,0_1,0_2,0_3,0_4   #,1_0,1_1,1_2,1_3,1_4
shift_dir=shifts        # = config_gen.conf shift_dir: tile_offsets.txt + <tile>.txt.
                        # These ARE cshifts_final here -- no shift estimation, and
                        # /exchange/cshifts_final in the tile files is not read.

# --- grids -------------------------------------------------------------------
bin=2                   # the level gen_data.py generated; frames are ndet>>bin.
                        # Must equal config_gen.conf bin: that is the only
                        # /exchange/pdata{k}_{bin} in the tile files.
# The three sizes below are BINNED object px, as in config_step6.conf -- they are
# config_gen.conf's nobj/nzobj divided by 2**bin.
nobj=3072               # mosaic width   (= config_gen.conf nobj  >> bin)
nzobj=896 #448               # mosaic height  (= config_gen.conf nzobj >> bin)
nobj_tile=0             # per-tile working grid.  0 -> auto:
                        # ceil((n/min(norm_mag) + 2*max|shift|/2**bin + 8)/64)*64

# --- reconstruction ----------------------------------------------------------
paganin=100             # delta/beta for the Paganin filter AND the tag written into
                        # obj_init_re{paganin}_{bin}.  Keep equal to config_gen.conf
                        # delta_beta (the sample really is single-material) and to
                        # config_step6.conf paganin.
mask=1.2                # FBP circular mask radius^2 in units of (nobj/2); -1 disables

# --- runtime -----------------------------------------------------------------
nchunk=4                # z slices per GPU batch in the FBP
log_level=INFO
