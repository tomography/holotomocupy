# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
version: 2
sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: false
python:
  install:
    - requirements: envs/requirements-doc.txt
submodules:
  recursive: false
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
# No pdf: the latex builder is the usual cause of a red build, and several
# docstrings are plain text that docutils parses loosely.
formats: []
