# Atomium S1, SINGLE-distance FT, +-300 px random displacement, 4.5 nm voxels
# -- ESRF ID16A, proposal blc17322, beamtime 20260825, attempt _0001.
# STEP 0: near-field ptychography (NFP) probe retrieval.

path=/eagle/APS_IRI/vnikitin/20260829/AtomiumS1/Atomium_S1_FT_4K_RD300_004p5nm_0001
path_out=/eagle/APS_IRI/vnikitin/20260829/AtomiumS1/Atomium_S1_FT_4K_RD300_004p5nm_0001_rec

nx_file=projections/Atomium_S1_FT_4K_RD300_004p5nm_0001_NFP_before_0001.nx # NXtomo input (relative to path)
h5_out=nfp_results.h5 # NFP output: probe, positions (relative to path_out)

nchunk=4              # projections per GPU batch (only 50 frames in total)
n=4096                # detector size (pixels) -- full frame, as the tomogram uses

niter=513             # number of NFP iterations
checkpoint_step=-1    # save checkpoint every N iters (-1 = disabled)
error_step=16         # print error every N iters

rho=1,2,0.1           # gradient step scales: object, probe, positions

estimate_rho=True
rho_estimate_niter=16
rho_trial_error_step=-1
log_level=INFO

# --- INTENSITY misfit and the PSF ---
psf_sigma=0.0

# --- shift interpolation ---
shift_type=fft
