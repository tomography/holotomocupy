path=/eagle/APS_IRI/vnikitin/20260829/AtomiumS1 # raw data root
path_out=/eagle/APS_IRI/vnikitin/20260829/AtomiumS1/Atomium_S1_FT_4K_RD300_004p5nm_0001_rec_paper # steps15 output
pfile=Atomium_S1_FT_4K_RD300_004p5nm_0001 # scan prefix name

start_step=1          # 1=convert, 2=preprocess, 3=shifts, 4=binned, 5=paganin+fbp

# --- Binning levels for the hierarchical (coarse-to-fine) reconstruction ---
nlevels=3             # 4096 / 2048 / 1024
start_level_rec=2     # = nlevels-1

nchunk=4              # z-slices per GPU chunk in FBP (step 5)

n=4096                # 0 = auto-detect from the frame shape; >0 overrides the crop
nobj=4096             # stitched object size at full resolution (bin 0), = n

# --- The shift model: what goes into cshifts_final -----------------------
# Exactly four terms, all of them ours:
#     commanded random displacement   <pfile>/projections/<pfile>_000k.txt
#   + sample drift                    OFF unless motion_src=quali below.  With
#                                     'quali' it is measured from the post-scan
#                                     retakes: the scan writes ntheta+3 frames
#                                     and the last three re-take omega 180/90/0,
#                                     so each one correlated against its in-scan
#                                     twin gives a drift point.  Three points,
#                                     quadratic, mean removed.  With 'none' the
#                                     term is zero and step 7 owns the drift.
#   + inter-plane rhapp               measured from the frames (zero at ndist=1).
#                                     Measured with the drift already undone,
#                                     or it would re-measure it and the two
#                                     would be counted twice.
#     ^ these three are step 3
#   + rotation axis                   measured in STEP 4b, after step 4 and
#                                     before step 5's Paganin, from opposed
#                                     (theta, theta+180) pairs of bin-0 PAGANIN
#                                     projections.  Phase, never frames: the
#                                     axis is a mirror symmetry of the object,
#                                     and a 4.5 nm hologram is mostly Fresnel
#                                     fringes, which do not mirror.  It cannot
#                                     run in step 3 (phase needs step 4's
#                                     pdata{k}_0) nor in step 5 (step 5 is the
#                                     consumer), hence 4b.  Nothing is cached:
#                                     each run measures the RESIDUAL, so a
#                                     re-run returns ~0 and changes nothing.
# and nothing else.  No source knobs, and no ESRF file: correct_motion.txt,
# correct_correct3D.txt and rhapp.mat are not read by the pipeline any more.
#
# STEP 7 OWNS WHAT IS LEFT OF THE DRIFT.  Step 3's term is a quadratic through
# three retake points -- it catches the bulk, which on FT_RD300 is ~113 object
# px, but it cannot see structure the three points do not resolve.  So pass 1
# still reconstructs with the positions frozen, step7.py fits the residual
# drift out of that volume into correct_correct3D_extra.txt, and step 6 adds it
# on pass 2 -- see polaris_run.sh.  The two are complementary: one measured off
# the raw frames before anything is reconstructed, one off the reconstruction.
#
# ndist=1, so rhapp is zero by construction: the commanded +-300 px and the
# measured axis are the whole of cshifts_final on this scan.
#
# ESRF'S AXIS IS A MAGNITUDE CHECK, NOT THE ARBITER.  His nabu drop states a
# number and step 3 logs ours against it, at INFO and never as a warning: he
# reconstructed on his own reference plane, and the object pixel size follows
# norm_magnifications[ref_dist], so the same physical axis takes a different
# value per plane; he also folds a motion correction into his geometry, which
# the axis absorbs part of.  Several px of disagreement is expected.  The
# check that does mean something is the `Step 4b: axis verify` line: it
# re-measures with the axis folded in, and the residual must come back near
# zero.
#
# MUST STAY 0.  The measured axis is already inside cshifts_final, which is the
# one place the horizontal shift column lives; steps 4, 5 and 6 would add
# anything typed here ON TOP of it, so steps15 refuses the combination at
# startup -- whatever start_step is -- rather than doubling the offset.  center_src=config is the way back to a typed-in
# number, and then this is where it goes.
rotation_center_shift=0
center_src=measured
# Sample drift: 'none' leaves the whole drift to step 7, which fits it out of a
# finished volume -- what the pipeline did before the retake estimator existed.
# 'quali' measures it in step 3 from the post-scan retakes; only select it on a
# scan where estimate_quali_motion.py --validate has been checked against
# quali.mat, since a wrong drift here is harder to undo than no drift at all.
motion_src=none
paganin=35            # delta/beta ratio for Paganin (step 5)
ref_dist=0            # reference plane index (0-based); ndist=1, so this is forced
log_level=INFO
