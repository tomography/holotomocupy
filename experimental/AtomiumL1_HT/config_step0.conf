#
# There is no plain *_NFP_* or *_NFPwS_* companion for AtomiumL1_HT_014nm
# (AtomiumL1_largedisp does have one -- see ../AtomiumL1_largedisp/config_step0.conf).
#
# So this dataset runs like Y350a_HT: leave prb_file unset in the
# config_step6_bin*.conf files, and the probe is initialised from the flat
# field at bin 2, then inherited through the ladder.
#
# TO ENABLE, two things are needed:
#   1. decide what the CA scan positions actually are -- whether the sample
#      stage moved at all, and under which motor names;
#   2. teach step0.py to read them (it hard-codes spy/spz at step0.py:107-108),
#      and to model the coded aperture in front of the probe if one was in.
