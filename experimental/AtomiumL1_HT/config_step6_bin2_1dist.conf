# AtomiumL1, HT scan, 14 nm, 4 distances -- ESRF ID16A, proposal ihmi1591, 2025-06-08.
# BH reconstruction (step 6) -- hierarchical level bin=2.

path=/data3/vnikitin/ESRF/atomium/20250607/AtomiumL1_rec/AtomiumL1_HT_014nm_rec
in_file=AtomiumL1_HT_014nm.h5
path_out=/data3/vnikitin/ESRF/atomium/20250607/AtomiumL1_rec/AtomiumL1_HT_014nm_rec6_1dist # step-6 output, SHARED by all three levels

nchunk=32             # projections per GPU batch
ntheta=1800           # number of projection angles (show_geometry.py; .info TOMO_N=1800)
start_theta=0         # index of first projection angle
ndist=1               # number of distances

niter=1025            # last iteration executed is 1024
start_iter=0          # 0 = start fresh from the step-5 Paganin+FBP volume
checkpoint_step=32    # save checkpoint every N iters (-1 = disabled)
error_step=32         # print error every N iters

nz=512                # vertical detector size = 2048 / 2**2
n=512                 # horizontal detector size = 2048 / 2**2
nzobj=512             # vertical object size = 2048 / 2**2
nobj=512              # horizontal object size = 2048 / 2**2
bin=2                 # binning level; needs start_level_rec <= 2 in config_steps15.conf

rotation_center_shift=-14.375964 # offset of the rotation axis from the grid
paganin=120           # MUST match paganin in config_steps15.conf
mask=1.1              # circular mask radius as fraction of n (-1 = no mask)

# --- out-of-grid detector pixels ---
mask_oob=1            # 1 = drop out-of-grid detector pixels (default), 0 = keep every pixel
mask_oob_margin=2     # extra slack in detector pixels, covering pos drift during refinement

lam_prbfit=3.1e-3     # probe fit regularisation weight
lam_laplacian=2.5e-5
rho=1,0.1,0.08,1e-4   # gradient step scales: object, probe, positions, tp (linear shrink A,B)
estimate_rho=False
rho_estimate_niter=16

log_level=INFO
