# Y350a, large random displacement, 6 nm voxels, 1 distance -- ESRF ID16A 2025-06-04.
# BH reconstruction (step 6) -- hierarchical level bin=1 (2x2 binning).

path=/eagle/APS_IRI/vnikitin/20250604/Y350a_FT_large_rand_disp_006nm_rec # steps15 output dir: holds <pfile>.h5 and <pfile>_obj.h5
in_file=Y350a_FT_large_rand_disp_nobin_006nm.h5
path_out=/eagle/APS_IRI/vnikitin/20250604/Y350a_FT_large_rand_disp_006nm_rec6 # step-6 output, SHARED by all three levels
nchunk=4              # projections per GPU batch
ntheta=4000           # number of projection angles
start_theta=0         # index of first projection angle
ndist=1               # number of distances

niter=769             # last iteration executed is 768
start_iter=512        # resumes from checkpoints/checkpoint_0512.h5, written by the bin-2 run
checkpoint_step=32    # save checkpoint every N iters (-1 = disabled)
error_step=32         # print error every N iters

nz=2048               # vertical detector size = 4096 / 2**1
n=2048                # horizontal detector size = 4096 / 2**1
nzobj=2368            # vertical object size = 4736 / 2**1
nobj=2368             # horizontal object size = 4736 / 2**1
bin=1                 # binning level; needs start_level_rec <= 1 in config_steps15.conf

rotation_center_shift=-37.50 # rotation axis offset from grid centre, in bin-0
paganin=40            # MUST match paganin in config_steps15.conf
mask=1.1              # circular mask radius as fraction of n (-1 = no mask)

# --- out-of-grid detector pixels ---
mask_oob=1            # 1 = drop out-of-grid detector pixels (default), 0 = old behaviour
mask_oob_margin=2     # extra slack in detector pixels, covering pos drift during refinement

lam_prbfit=3.1e-3     # probe fit regularisation weight
lam_laplacian=5e-5    # 3-D Laplacian regularisation weight
rho=1.0,0.0125,0.04,0 # gradient step scales: object, probe, positions, tp (linear shrink A,B)
log_level=INFO
