# Atomium S1, SINGLE-distance FT, +-100 px random displacement, 4.5 nm voxels
# -- ESRF ID16A, proposal blc17322, beamtime 20260825, scan _0001.
# BH reconstruction (step 6) -- hierarchical level bin=1 (2x2 binning).
#
# PASS 1 of 2 -- POSITIONS FROZEN.
#
# The ladder is run twice.  Pass 1 (these *_nopos.conf files, bin 2 then bin 1)
# holds the positions at the cshifts_final step 3 computed: rho[2]=0 makes
# gradpos identically zero in rec_mpi.py, so nothing moves.  step7.py then
# reads the pass-1 bin-1 checkpoint and writes correct_correct3D_extra.txt
# NEXT TO THE CONFIGS, where every step-6 config in this directory picks it up
# via correct3d_extra=1.  Pass 2 is the unsuffixed config_step6_bin{2,1,0}.conf
# with their original rho[2], reading that file and refining on top of it.
#
# Why freeze at all: step7.py's own docstring warns that the volume it
# re-projects "was reconstructed with the shifts already in place, so on a
# converged reconstruction part of what comes out is the metric's own bias".
# A position-frozen pass-1 volume removes that confound -- the drift step7
# measures is the sample's, not a residue of the refinement that preceded it.
#
# Separate path_out (_rec6_paper_nopos) so pass 2 cannot overwrite the volume step7
# was derived from; both iteration ladders start at 0 and would otherwise
# collide in checkpoints/.

path=/eagle/APS_IRI/vnikitin/20260829/AtomiumS1/Atomium_S1_FT_4K_RD100_004p5nm_0001_rec_paper # steps15 output dir
in_file=Atomium_S1_FT_4K_RD100_004p5nm_0001.h5
path_out=/eagle/APS_IRI/vnikitin/20260829/AtomiumS1/Atomium_S1_FT_4K_RD100_004p5nm_0001_rec6_paper_nopos # PASS 1 (positions frozen) -- separate from the pass-2 _rec6_paper tree

nchunk=8              # projections per GPU batch
ntheta=12000          # projection angles, 0..179.985 deg in 0.015 deg steps
start_theta=0         # index of first projection angle
ndist=1               # number of distances (z1 = 3.698060 mm)

niter=1281            # runs iterations 1024..1280
start_iter=1024       # resumes from checkpoints/checkpoint_1024.h5, written by the bin-2 run
checkpoint_step=32    # save checkpoint every N iters (-1 = disabled)
error_step=32         # print error every N iters

nz=2048               # vertical detector size = 4096 / 2**1
n=2048                # horizontal detector size = 4096 / 2**1
nzobj=2048            # vertical object size = 4096 / 2**1
nobj=2048             # horizontal object size = 4096 / 2**1
bin=1

# MUST STAY 0: step 3 folded the measured rotation axis into cshifts_final
# (center_src=measured in config_steps15.conf) and reader.py adds whatever is
# here on top of it, so a non-zero value double-counts the axis.
rotation_center_shift=0
paganin=35            # MUST match paganin in config_steps15.conf
mask=1.1              # circular mask radius as fraction of n (-1 = no mask)
mask_oob=1            # 1 = drop out-of-grid detector pixels (default), 0 = old behaviour
mask_oob_margin=2     # extra slack in detector pixels, covering pos drift during refinement

# --- detector PSF ---
psf_sigma=0.0         # Gaussian sigma in BINNED detector px; 0 skips the blur

lam_prbfit=3.1e-3     # probe fit regularisation weight
lam_laplacian=2.5e-5  # 3-D Laplacian regularisation weight
rho=1.0,0.00625,0,0.0   # positions FROZEN for pass 1 (rho[2]=0); pass 2 restores the value in config_step6_bin1.conf
estimate_rho=False    # only worth running at bin 2 -- see config_step6_bin2.conf
rho_estimate_niter=16 # iterations per trial
log_level=INFO

# --- step 7's drift refinement ---
correct3d_extra=0     # PASS 1: never apply step 7's file, even if one is
                      # left over from an earlier run.  Pass 1 is the
                      # unrefined baseline step 7 measures against; if a
                      # stale file were applied here, step 7 would fit only
                      # the residual and pass 2 would silently drop the
                      # correction already folded into it.
correct3d_bin=2       # FACTOR, not a level: the file is 2x2-binned px
