# ctxl cortex tissue, 4-distance HT, +-300 px random displacement, 7.5 nm
# voxels -- ESRF ID16A 2026-08-29..31, proposal ihls3888.
# BH reconstruction (step 6) -- hierarchical level bin=0 (1x1 binning).

path=/eagle/APS_IRI/vnikitin/20260829/ctxl/ctxl_HT_4K_RD300_007p5nm_0001_rec # steps15 output dir
in_file=ctxl_HT_4K_RD300_007p5nm_0001.h5
path_out=/eagle/APS_IRI/vnikitin/20260829/ctxl/ctxl_HT_4K_RD300_007p5nm_0001_rec6_u2 # step-6 output, SHARED by all three levels

nchunk=2              # projections per GPU batch
ntheta=4000           # projection angles, 0..180 deg in 0.045 deg steps
start_theta=0         # index of first projection angle
ndist=4               # number of distances (z1 = 6.164, 6.428, 7.486, 9.682 mm)

niter=1537            # last iteration executed is 1536
start_iter=1280       # resumes from checkpoints/checkpoint_1280.h5, written by the bin-1 run
checkpoint_step=32    # save checkpoint every N iters (-1 = disabled)
error_step=32         # print error every N iters

nz=4096               # vertical detector size = 4096 / 2**0
n=4096                # horizontal detector size = 4096 / 2**0
nzobj=5056            # vertical object size = 5056 / 2**0 -- z is NOT coarsened
nobj=2528             # horizontal OBJECT size
tomo_upsample=2       # detector oversampling of the Radon transform
bin=0                 # binning level; needs start_level_rec <= 0 in config_steps15.conf

rotation_center_shift=-15.77
paganin=60            # MUST match paganin in config_steps15.conf
mask=1.1              # circular mask radius as fraction of n (-1 = no mask)

# --- detector PSF ---
psf_sigma=0.0         # Gaussian sigma in BINNED detector px; 0 skips the blur

# --- out-of-grid detector pixels ---
mask_oob=1            # 1 = drop out-of-grid detector pixels (default), 0 = old behaviour
mask_oob_margin=2     # extra slack in detector pixels, covering pos drift during refinement

lam_prbfit=3.1e-3     # probe fit regularisation weight
lam_laplacian=0       # 3-D Laplacian regularisation weight
rho=1.0,0.05,0.01,0   # gradient step scales: object, probe, positions, tp (linear shrink A,B)
estimate_rho=False    # only worth running at bin 2 -- see config_step6_bin2.conf
rho_estimate_niter=16 # iterations per trial
log_level=INFO

# --- step 7's drift refinement ---
correct3d_extra=1
correct3d_bin=2       # FACTOR, not a level: the file is 2x2-binned px