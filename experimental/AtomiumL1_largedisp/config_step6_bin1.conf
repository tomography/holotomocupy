# AtomiumL1, FT large random displacement, 14 nm, 1 distance -- ESRF ID16A,
# proposal ihmi1591, 2025-06-08.
# BH reconstruction (step 6) -- hierarchical level bin=1.

path=/data3/vnikitin/ESRF/atomium/20250607/AtomiumL1_rec/AtomiumL1_FT_large_rand_disp_014nm_rec # steps15 output dir
in_file=AtomiumL1_FT_large_rand_disp_014nm.h5
path_out=/data3/vnikitin/ESRF/atomium/20250607/AtomiumL1_rec/AtomiumL1_FT_large_rand_disp_014nm_rec6 # step-6 output, SHARED by all three levels

nchunk=8              # projections per GPU batch
ntheta=1800           # number of projection angles (show_geometry.py; .info TOMO_N=1800)
start_theta=0         # index of first projection angle
ndist=1               # number of distances

niter=1281            # last iteration executed is 1280
start_iter=1024       # resume from checkpoint_1024.h5 written by bin 2
checkpoint_step=32    # save checkpoint every N iters (-1 = disabled)
error_step=32         # print error every N iters

nz=1024               # vertical detector size = 2048 / 2**1
n=1024                # horizontal detector size = 2048 / 2**1
nzobj=1024            # vertical object size = 2048 / 2**1
nobj=1024             # horizontal object size = 2048 / 2**1
bin=1                 # binning level; needs start_level_rec <= 1 in config_steps15.conf

rotation_center_shift=-11.5 # offset of the rotation axis from the grid
paganin=120           # MUST match paganin in config_steps15.conf
mask=1.1              # circular mask radius as fraction of n (-1 = no mask)

# --- out-of-grid detector pixels ---
mask_oob=1            # 1 = drop out-of-grid detector pixels (default), 0 = keep every pixel
mask_oob_margin=2     # extra slack in detector pixels, covering pos drift during refinement

lam_prbfit=3.1e-3     # probe fit regularisation weight
lam_laplacian=5e-5    # 3-D Laplacian regularisation weight
rho=1.0,0.025,0.08,2e-05 # gradient step scales: object, probe, positions, tp (linear shrink A,B)

log_level=INFO
