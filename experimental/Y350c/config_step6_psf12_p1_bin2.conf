path=/eagle/APS_IRI/vnikitin/20240515/Y350c_rec # steps15 output dir: where the h5 lives
in_file=Y350c_HT_015nm.h5
path_out=/eagle/APS_IRI/vnikitin/20240515/Y350c_rec6_psf12_p1 # step-6 output for THIS half, shared by its levels

nchunk=16            # projections per GPU batch -- lower first if bin 2 runs out of GPU memory
ntheta=1500          # half of 3000: ids = arange(1, 3000, 2)
start_theta=1         # odd global angle indices
ndist=4               # number of distances

niter=1025            # last iteration executed is 1024
start_iter=0          # 0 = start fresh from the step-5 Paganin+FBP volume
checkpoint_step=32    # save checkpoint every N iters (-1 = disabled)
error_step=32         # print error every N iters

nz=512               # vertical detector size = 2048 / 2**2
n=512                # horizontal detector size = 2048 / 2**2
nzobj=640            # vertical object size = 2560 / 2**2
nobj=640             # horizontal object size = 2560 / 2**2
bin=2                 # binning level; needs start_level_rec <= 2 in config_steps15.conf

rotation_center_shift=145.07 # raw px; MUST match the other levels
paganin=100           # MUST match config_steps15.conf
psf_sigma=0.3           # 1.2 raw detector px / 2**2  (sigma is in BINNED px)
shift_type=cubic      # multidistance: m != 1, so fft would take the chirp-z
correct3d_extra=1     # read correct_correct3D_extra.txt (step7) if present
correct3d_bin=1       # FACTOR, not a level: step7 writes raw detector px
mask=-1               # circular mask radius as fraction of n (-1 = no mask)

lam_prbfit=3.1e-3     # probe fit regularisation weight
lam_laplacian=3e-5    # binned level: the Laplacian keeps the coarse volume smooth
rho=1,0.1,0,0         # obj, prb, pos, tp -- rho[pos]=0 FREEZES the positions
pos_checkpoint=/eagle/APS_IRI/vnikitin/20240515/Y350c_rec6_psf12/checkpoints/checkpoint_1536.h5
estimate_rho=False     # coordinate search over rho[prb], rho[pos]: +96 iters here
rho_estimate_niter=16 # iterations per trial

log_level=INFO
