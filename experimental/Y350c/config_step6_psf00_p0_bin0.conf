path=/eagle/APS_IRI/vnikitin/20240515/Y350c_rec # steps15 output dir: where the h5 lives
in_file=Y350c_HT_015nm.h5
path_out=/eagle/APS_IRI/vnikitin/20240515/Y350c_rec6_psf00_p0 # step-6 output for THIS half, shared by its levels

nchunk=4             # projections per GPU batch -- lower first if bin 0 runs out of GPU memory
ntheta=1500          # half of 3000: ids = arange(0, 3000, 2)
start_theta=0         # even global angle indices
ndist=4               # number of distances

niter=1537            # last iteration executed is 1536
start_iter=1280       # resumes from checkpoints/checkpoint_1280.h5, written by the bin-1 run
checkpoint_step=32    # save checkpoint every N iters (-1 = disabled)
error_step=32         # print error every N iters

nz=2048              # vertical detector size = 2048 / 2**0
n=2048               # horizontal detector size = 2048 / 2**0
nzobj=2560           # vertical object size = 2560 / 2**0
nobj=2560            # horizontal object size = 2560 / 2**0
bin=0                 # binning level; needs start_level_rec <= 0 in config_steps15.conf

rotation_center_shift=145.07 # raw px; MUST match the other levels
paganin=100           # MUST match config_steps15.conf
psf_sigma=0             # 0 raw detector px / 2**0  (sigma is in BINNED px)
shift_type=cubic      # multidistance: m != 1, so fft would take the chirp-z
correct3d_extra=1     # read correct_correct3D_extra.txt (step7) if present
correct3d_bin=1       # FACTOR, not a level: step7 writes raw detector px
mask=-1               # circular mask radius as fraction of n (-1 = no mask)

lam_prbfit=3.1e-3     # probe fit regularisation weight
lam_laplacian=0       # off at full resolution, so the data decide the fine detail
rho=1,0.1,0,0         # obj, prb, pos, tp -- rho[pos]=0 FREEZES the positions
pos_checkpoint=/eagle/APS_IRI/vnikitin/20240515/Y350c_rec6_psf00/checkpoints/checkpoint_1536.h5
estimate_rho=False     # coordinate search over rho[prb], rho[pos]: +96 iters here
rho_estimate_niter=16 # iterations per trial

log_level=INFO
