path=/eagle/APS_IRI/vnikitin/20240515/Y350c_rec # steps15 output dir: where the h5 lives
in_file=Y350c_HT_015nm.h5
path_out=/eagle/APS_IRI/vnikitin/20240515/Y350c_rec6_psf15 # step-6 output for THIS psf arm, shared by its levels

nchunk=8             # projections per GPU batch -- lower first if bin 1 runs out of GPU memory
ntheta=3000           # number of projection angles
start_theta=0         # index of first projection angle
ndist=4               # number of distances

niter=1281            # last iteration executed is 1280
start_iter=1024       # resumes from checkpoints/checkpoint_1024.h5, written by the bin-2 run
checkpoint_step=32    # save checkpoint every N iters (-1 = disabled)
error_step=32         # print error every N iters

nz=1024              # vertical detector size = 2048 / 2**1
n=1024               # horizontal detector size = 2048 / 2**1
nzobj=1280           # vertical object size = 2560 / 2**1
nobj=1280            # horizontal object size = 2560 / 2**1
bin=1                 # binning level; needs start_level_rec <= 1 in config_steps15.conf

rotation_center_shift=145.07 # raw px; MUST match the other levels
paganin=100           # MUST match config_steps15.conf
psf_sigma=0.75          # 1.5 raw detector px / 2**1  (sigma is in BINNED px)
shift_type=cubic      # multidistance: m != 1, so fft would take the chirp-z
correct3d_extra=1     # read correct_correct3D_extra.txt (step7) if present
correct3d_bin=1       # FACTOR, not a level: step7 writes raw detector px
mask=-1               # circular mask radius as fraction of n (-1 = no mask)

lam_prbfit=3.1e-3     # probe fit regularisation weight
lam_laplacian=3e-5    # half of bin 2 -- twice the voxels, half the weight
rho=1,0.1,0.1,0  # gradient step scales: object, probe, positions, tp (linear shrink A,B)
estimate_rho=False     # coordinate search over rho[prb], rho[pos]: +96 iters here
rho_estimate_niter=16 # iterations per trial

log_level=INFO
