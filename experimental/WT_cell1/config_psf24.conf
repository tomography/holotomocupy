# WT_H cell01, 2-D near-field ptychography, 25 nm voxels
# -- ESRF ID16A, proposal ihls3905, beamtime 20260929, scan _0001.
# STEP 0 is the WHOLE pipeline here: this is a standalone NFP2D scan at one
# rotation angle (somega=35 deg), so there is no tomogram and no step 6.
#
# The numbers below mirror the run ESRF already did on this scan with the
# holotomocupy CLI -- nfp_BH_basic/ beside the data, 2026-10-05.  n, nobj,
# ntheta and nchunk come out identical here, so the error curve in its
# conv_nfp.csv is directly comparable.  See README.md.

# path_out mirrors the layout of ESRF's own nfp_BH_basic/scan0001 beside it,
# so conv_nfp.csv and checkpoints_tiff/ land side by side with the reference.
path=/eagle/APS_IRI/vnikitin/20260929/PROCESSED_DATA
path_out=/eagle/APS_IRI/vnikitin/20260929/PROCESSED_DATA/nfp_psf24_512/scan0001

nx_file=projections/WT_H_cell01_NFP2D_025nm_0001_scan0001.nx # NXtomo input (relative to path)
h5_out=nfp_results.h5 # NFP output: probe, object, position errors (relative to path_out)

nchunk=4              # frames per GPU batch (only 50 frames in total)
n=2048                # detector size (pixels) -- full balor frame

niter=512              # number of NFP iterations
checkpoint_step=64    # proj/prb TIFF snapshots every N iters (-1 = disabled)
error_step=16         # print error every N iters -- same grid as conv_nfp.csv

# Gradient step scales: object, probe, positions.  rho[prb]=32 from the sweep
# in README.md.  alpha is shared by all three, so a large rho[prb] also drives
# the step down and all but freezes the positions (max |dpos| ~1e-4 px here).
rho=1,32,1e-2

# Coordinate-search rho[prb], then rho[pos], on a geometric grid around the
# values above before the loop starts; rho[proj] is the reference scale and is
# left alone.  Costs 3..19 silent trials of rho_estimate_niter iterations per
# coordinate.  NOTE this is the one knob here the reference run did NOT use,
# so err is no longer iteration-for-iteration comparable with nfp_BH_basic --
# the search can also walk rho[pos] up from 1e-5 and unfreeze the positions.
estimate_rho=False
rho_estimate_niter=32
rho_trial_error_step=-1
log_level=INFO

# --- misfit model and the detector PSF ---
# psf_sigma is in UNBINNED detector px (NFP never bins).  0 until the empty-air
# rms says otherwise -- err cannot choose it, see README.
model=amplitude
psf_sigma=2.4

# --- shift interpolation ---
# 'fft' is periodic, so nobj must clear n + 2*max|pos|; step0.py rounds it up
# to 2176, which is what the reference run used.
shift_type=fft
