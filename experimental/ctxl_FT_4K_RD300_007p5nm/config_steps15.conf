# ctxl (cortex), SINGLE-distance FT scan, +-300 px random sample displacement,
# 7.5 nm voxels -- ESRF ID16A, proposal ihls3888, 2026-08-29..31, attempt _0003.
# Same sample, plane and geometry as ../ctxl_HT_4K_RD300_007p5nm.
# Rationale, provenance and the measurements behind every value: README.md.

path=/eagle/APS_IRI/vnikitin/20260829/ctxl # raw data root
path_out=/eagle/APS_IRI/vnikitin/20260829/ctxl/ctxl_FT_4K_RD300_007p5nm_0003_rec # steps15 output
pfile=ctxl_FT_4K_RD300_007p5nm_0003 # scan prefix name; _0001 aborted at 82.8 deg, _0002 has no data

start_step=3          # 1=convert, 2=preprocess, 3=shifts, 4=binned, 5=paganin+fbp
nlevels=1             # binning levels step 4 writes: 4096 / 2048 / 1024
start_level_rec=0     # finest level to get an FBP init (2 = bin 2 only; 0 costs 885 GB more)

nchunk=4              # z-slices per GPU chunk in FBP (step 5)

n=4096                # 0 = auto-detect from the frame shape; >0 overrides the crop
nobj=4800             # stitched object size at bin 0: 4096 + 2*300 sweep, rounded to 75*64

rotation_center_shift=+15.47 # raw px, from ESRF's own naburec/nabu_final_cm.conf
paganin=60            # delta/beta for Paganin (step 5)
rhapp_bin=1           # unused: no rhapp.mat at ndist=1 (one plane). Pinned, not auto
correct3d_bin=2       # correct_correct3D.txt is fitted on the 2x2 binned grid
ref_dist=0            # reference distance index; one plane, so it can only be 0
log_level=INFO
