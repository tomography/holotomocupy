# ctxl cortex tissue, SINGLE-distance FT, +-300 px random displacement, 7.5 nm
# voxels -- ESRF ID16A 2026-08-29..31, proposal ihls3888, attempt _0003.
# BH reconstruction (step 6) -- hierarchical level bin=0 (1x1 binning).

path=/eagle/APS_IRI/vnikitin/20260829/ctxl/ctxl_FT_4K_RD300_007p5nm_0003_rec # steps15 output dir
in_file=ctxl_FT_4K_RD300_007p5nm_0003.h5
path_out=/eagle/APS_IRI/vnikitin/20260829/ctxl/ctxl_FT_4K_RD300_007p5nm_0003_rec6 # step-6 output, SHARED by all three levels

nchunk=4              # projections per GPU batch -- lower first if bin 0 runs out of GPU memory
ntheta=12000          # projection angles, 0..179.985 deg in 0.015 deg steps
start_theta=0         # index of first projection angle
ndist=1               # number of distances (z1 = 6.163535 mm, the HT scan's plane 1)

niter=1537            # last iteration executed is 1536
start_iter=1280       # resumes from checkpoints/checkpoint_1280.h5, written by the bin-1 run
checkpoint_step=32    # save checkpoint every N iters (-1 = disabled)
error_step=32         # print error every N iters

nz=4096               # vertical detector size = 4096 / 2**0
n=4096                # horizontal detector size = 4096 / 2**0
nzobj=4800            # vertical object size = 4800 / 2**0
nobj=4800             # horizontal object size = 4800 / 2**0
bin=0                 # binning level; needs start_level_rec <= 0 in config_steps15.conf

rotation_center_shift=+15.47 # raw px, ESRF nabu; MUST match the other configs
paganin=60            # MUST match config_steps15.conf
mask=1.1              # circular mask radius as fraction of n (-1 = no mask)
mask_oob=1            # drop out-of-grid detector pixels
mask_oob_margin=2     # extra slack in detector px, covering pos drift during refinement

lam_prbfit=3.1e-3     # probe fit regularisation weight
lam_laplacian=0       # 3-D Laplacian regularisation weight
rho=1.0,0.0125,0.04,0 # gradient step scales: object, probe, positions, tp (linear shrink A,B)
estimate_rho=False    # only worth running at bin 2
rho_estimate_niter=16 # iterations per trial
log_level=INFO

# --- step 7's drift refinement ---
correct3d_extra=1
correct3d_bin=2       # FACTOR, not a level: the file is 2x2-binned px