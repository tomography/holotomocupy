# ---------------------------------------------------------------------------
# step0.py -- NFP probe retrieval. Only usable if this beamtime recorded an
# *_NFPwS_* companion scan for Y350a_HT_nobin_020nm. Check first:
#
#     ls -d /eagle/APS_IRI/vnikitin/20250604/*NFPwS*
#
# If nothing comes back, skip step0 entirely and leave prb_file unset in
# config_step6.conf -- the probe is then initialised from the flat field, which
# is what Y350a_largedisp does.
#
# If the scan does exist, fix the two file names below to match it exactly
# (the ls3231- prefix is the ESRF proposal id and appears in the meta file name)
# and uncomment the block.
# ---------------------------------------------------------------------------

# path=/eagle/APS_IRI/vnikitin/20250604
# path_out=/eagle/APS_IRI/vnikitin/20250604/Y350a_HT_nobin_020nm_rec
#
# scan_file=Y350a_HT_nobin_020nm_NFPwS_1_/Y350a_HT_nobin_020nm_NFPwS_1_0000.h5   # raw scan HDF5
# meta_file=Y350a_HT_nobin_020nm_NFPwS_1_/ls3231-Y350a-Y350a_HT_nobin_020nm_NFPwS_1_.h5  # beamline metadata
# h5_out=nfp_results.h5   # NFP output: probe, positions (relative to path_out)
#
# dataset_ids=1,2,3,4     # distance indices: replaces _1_ in scan_file
#
# nchunk=4                # projections per GPU batch
# n=2048                  # detector size (pixels)
#
# niter=513               # number of NFP iterations
# checkpoint_step=-1      # save checkpoint every N iters (-1 = disabled)
# error_step=32           # print error every N iters
#
# rho=1,2,0.1             # gradient step scales: object, probe, positions
# log_level=INFO
